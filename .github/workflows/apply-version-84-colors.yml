name: Apply version 84 colors

on:
  workflow_dispatch:
  push:
    branches:
      - version-84-colors-nec-resources
    paths:
      - ci/apply-version-84-colors.py
      - .github/workflows/apply-version-84-colors.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: version-84-colors-nec-resources
          fetch-depth: 0

      - name: Apply isolated visual changes
        run: python3 ci/apply-version-84-colors.py

      - name: Verify intended source scope
        run: |
          git diff --check
          git diff -- src/prerender/prerender_color.c resources/themes.ini src/main.c
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "resources/themes.ini src/main.c src/prerender/prerender_color.c "

      - name: Commit source changes
        run: |
          if git diff --quiet -- src/prerender/prerender_color.c resources/themes.ini src/main.c; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/prerender/prerender_color.c resources/themes.ini src/main.c
          git commit -m 'Windows: add light semantic antenna colors and NEC resources menu'
          git push
