name: Apply invalid NEC recovery v2

on:
  push:
    branches: [fix/invalid-nec-recovery-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply source changes
        run: python3 ci/apply-invalid-nec-recovery-v2.py
      - name: Verify intended diff
        run: |
          git diff --check
          git diff -- src/main.c src/freqplots/freqplots_core.c src/common.h
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.c src/freqplots/freqplots_core.c src/common.h
          git commit -m 'Fix recovery after invalid NEC loads'
          git push origin HEAD:fix/invalid-nec-recovery-v2
