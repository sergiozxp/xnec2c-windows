name: Build Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-ucrt64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_COMMIT: a0245e6c0ed4c44909993a83db9e2a162fa81a60
  ARTIFACT_NAME: xnec2c-windows-x64-ucrt64

jobs:
  build:
    name: MSYS2 UCRT64 / Cairo
    runs-on: windows-2022
    timeout-minutes: 50

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify pinned stable base and upstream ancestry
        shell: pwsh
        run: |
          $stable = "7ac07d0b5fdd346e3526f9364410a63b48a72fed"
          git cat-file -e "$env:UPSTREAM_COMMIT^{commit}"
          git merge-base --is-ancestor $env:UPSTREAM_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw "Pinned upstream commit is not an ancestor of HEAD" }
          git merge-base --is-ancestor $stable HEAD
          if ($LASTEXITCODE -ne 0) { throw "Stable Build #97 commit is not an ancestor of HEAD" }

      - name: Ensure MSIX branch does not modify functional source
        if: startsWith(github.ref_name, 'feature/msix-store-package')
        shell: pwsh
        run: |
          $stable = "7ac07d0b5fdd346e3526f9364410a63b48a72fed"
          $changed = @(git diff --name-only "$stable..HEAD")
          $forbidden = @($changed | Where-Object { $_ -match '^src/' -or $_ -match '^resources/' })
          if ($forbidden.Count -gt 0) {
            $forbidden | ForEach-Object { Write-Host "Forbidden functional change: $_" }
            throw "MSIX packaging branch must not modify functional source"
          }

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: >-
            autoconf
            automake
            gettext-devel
            git
            libtool
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gsl
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Verify toolchain and upstream manifest
        run: |
          set -euxo pipefail
          test "$MSYSTEM" = UCRT64
          source packaging/windows/upstream.env
          test "$XNEC2C_UPSTREAM_COMMIT" = "$UPSTREAM_COMMIT"
          gcc --version
          pkg-config --modversion gtk+-3.0 gsl gmodule-2.0

      - name: Generate build metadata
        run: |
          set -euo pipefail
          build_date="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          build_commit="$(git rev-parse HEAD)"
          printf '%s\n' \
            '#ifndef XNEC2C_BUILD_INFO_GENERATED_H' \
            '#define XNEC2C_BUILD_INFO_GENERATED_H' \
            "#define XNEC2C_BUILD_DATE \"$build_date\"" \
            "#define XNEC2C_BUILD_COMMIT \"$build_commit\"" \
            '#define XNEC2C_BUILD_SOURCE "sergiozxp/xnec2c-windows · feature/antenna-transform"' \
            '#endif' > src/build_info_generated.h

      - name: Generate configure scripts
        run: autoreconf --force --install

      - name: Configure without OpenGL
        run: ./configure --disable-opengl --disable-silent-rules

      - name: Build
        run: make -j"$(nproc)"

      - name: Run native test binaries
        run: make -C t check -j"$(nproc)"

      - name: Smoke test executable
        run: |
          ./src/xnec2c.exe --version
          ldd ./src/xnec2c.exe

      - name: Assemble portable package
        run: |
          ./packaging/windows/package-portable.sh
          package="$PWD/dist/$ARTIFACT_NAME"
          objdump -p "$package/xnec2c-launcher.exe" | tee launcher-pe.txt
          grep -Eq 'Subsystem[[:space:]]+00000002.*Windows GUI' launcher-pe.txt
          "$package/xnec2c-launcher.exe" --version
          PATH="$package/bin:/usr/bin" "$package/bin/xnec2c.exe" --version
          ldd "$package/xnec2c-launcher.exe" | tee launcher-ldd.txt
          ! grep -q 'not found' launcher-ldd.txt
          PATH="$package/bin:/usr/bin" ldd "$package/bin/xnec2c.exe" | tee portable-ldd.txt
          ! grep -q 'not found' portable-ldd.txt

          relocated="$(mktemp -d)/relocated-xnec2c"
          cp -a "$package" "$relocated"
          (
            cd /tmp
            "$relocated/xnec2c-launcher.exe" --version
          )

      - name: Verify portable package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/$env:ARTIFACT_NAME"
          $exe = Join-Path $package "bin/xnec2c.exe"
          $launcher = Join-Path $package "xnec2c-launcher.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Portable xnec2c.exe was not produced" }
          if (-not (Test-Path -LiteralPath $launcher)) { throw "Native Windows launcher was not produced" }
          $dlls = @(Get-ChildItem -LiteralPath (Join-Path $package "bin") -Filter *.dll)
          if ($dlls.Count -eq 0) { throw "No runtime DLLs were packaged" }
          $launcherProcess = Start-Process -FilePath $launcher -ArgumentList "--version" `
            -WorkingDirectory $env:TEMP -PassThru -Wait
          if ($launcherProcess.ExitCode -ne 0) { throw "Launcher smoke test failed with exit code $($launcherProcess.ExitCode)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $launcher
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          Write-Host "Packaged $($dlls.Count) runtime DLLs"

      - name: Smoke-test packaged GUI startup
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/$env:ARTIFACT_NAME"
          $launcher = Join-Path $package "xnec2c-launcher.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "xnec2c-gui-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "xnec2c-gui-stderr.txt"
          $process = Start-Process -FilePath $launcher -WorkingDirectory $package `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            Write-Host "xnec2c exited during the GUI startup smoke test."
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Packaged GUI exited prematurely with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force

      - name: Build per-user Inno Setup installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1

      - name: Build and validate MSIX package
        shell: pwsh
        run: ./packaging/windows/build-msix.ps1

      - name: Prepare portable ZIP for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/antenna-transform' && github.event.head_commit.message == 'Publish Xnec2c 5.0 Windows release'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:ARTIFACT_NAME" `
            -DestinationPath "dist/Xnec2c-5.0-Windows-x64-Portable.zip" -Force

      - name: Publish public Xnec2c 5.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/antenna-transform' && github.event.head_commit.message == 'Publish Xnec2c 5.0 Windows release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          ## Xnec2c 5.0 para Windows 10 y Windows 11

          Primera versión de la serie 5.0, basada en Xnec2c/NEC2 y compilada para Windows x64 con MSYS2 UCRT64, GTK 3 y Cairo. OpenGL permanece desactivado para maximizar la compatibilidad.

          ### Mejoras desde `8a3ce27` (`v4.4.18-windows.1`)

          - Nueva herramienta para transformar la antena completa: traslación, rotación y escalado sobre los ejes X, Y y Z.
          - Nueva ventana unificada **Setup** con barrido de frecuencias, tipo de terreno y material de antena.
          - Setup lee los valores reales del archivo NEC abierto, incluidos terrenos y conductividades personalizados, además del radio y diámetro del conductor.
          - Las trampas y cargas del modelo se conservan al cambiar el material de los conductores.
          - Indicador modal y visible de cálculo/carga para evitar operaciones simultáneas mientras el modelo está ocupado.
          - Frequency Plots y Radiation Pattern poseen ejecución y estado independientes; abrir una ventana ya no inicia automáticamente el cálculo de la otra.
          - Sincronización bidireccional entre la línea verde de Frequency Plots, su frecuencia numérica y la frecuencia de Radiation Pattern.
          - Al introducir manualmente una frecuencia en Radiation Pattern se recalculan ROE, impedancia y demás valores y, cuando corresponde, se genera el nuevo patrón.
          - Frequency Plots inicia solamente con **VSWR** activo; Max Gain queda desactivado por defecto.
          - Correcciones de actualización visual: conservación del último patrón válido, normalización de patrones de muy baja ganancia y limpieza de gráficos al cargar otro modelo.
          - El programa pasa a identificarse como **Xnec2c 5.0 for Windows 10 and Windows 11**.
          - Nueva información de compilación accesible desde el programa.
          - **File → Save As** abre correctamente el diálogo de guardado y propone archivos `.nec`.
          - Protección del archivo original: cada NEC abierto se copia internamente y todos los cambios trabajan sobre esa copia. El original solo puede reemplazarse mediante Save As y la confirmación de sobrescritura.
          - Mejoras de diagnóstico, estabilidad del lanzador y validaciones automáticas del ejecutable, paquete portable, instalador y MSIX.

          ### Descargas

          - **Xnec2c-5.0-Windows-x64-Setup.exe**: instalador recomendado para Windows 10/11.
          - **Xnec2c-5.0-Windows-x64-Portable.zip**: versión portable, sin instalación.
          - **Xnec2c-5.0-Windows-x64.msix**: paquete MSIX para pruebas y distribución mediante Microsoft Store.
          - **Xnec2c-MSIX-Development.cer**: certificado de desarrollo del paquete MSIX.

          El instalador no está firmado digitalmente; Microsoft SmartScreen puede mostrar una advertencia. El código fuente completo y el historial de cambios permanecen disponibles públicamente en este repositorio.

          Comparación completa: https://github.com/sergiozxp/xnec2c-windows/compare/8a3ce2773507f5c21dbcb11b1e8aa3babf716a5c...v5.0-windows.1
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8

          gh release create "v5.0-windows.1" `
            "dist/installer/Xnec2c-5.0-Windows-x64-Setup.exe" `
            "dist/Xnec2c-5.0-Windows-x64-Portable.zip" `
            "dist/msix/Xnec2c-5.0-Windows-x64.msix" `
            "dist/msix/Xnec2c-MSIX-Development.cer" `
            --target "${{ github.sha }}" `
            --title "Xnec2c 5.0 for Windows 10 and Windows 11" `
            --notes-file "$env:RUNNER_TEMP/release-notes.md" `
            --latest

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xnec2c-windows-x64-setup
          path: dist/installer/Xnec2c-5.0-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xnec2c-windows-x64-msix
          path: |
            dist/msix/Xnec2c-5.0-Windows-x64.msix
            dist/msix/Xnec2c-MSIX-Development.cer
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
