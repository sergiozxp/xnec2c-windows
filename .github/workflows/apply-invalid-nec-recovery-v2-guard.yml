name: Apply invalid NEC recovery v2 guard

on:
  push:
    branches: [fix/invalid-nec-recovery-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply guard
        run: python3 ci/apply-invalid-nec-recovery-v2-guard.py
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/freqplots/freqplots_core.c
          git commit -m 'Guard frequency plots during NEC input transactions'
          git push origin HEAD:fix/invalid-nec-recovery-v2
